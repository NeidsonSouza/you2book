version: 1
backend:
  phases:
    preBuild:
      commands:
        - yum install -y python3.12 python3.12-pip 2>/dev/null || apt-get install -y python3.12 python3-pip 2>/dev/null || echo "Python already available"
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*